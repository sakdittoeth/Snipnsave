<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Snips</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --tint:#faf9f8;
    --ink:#1a1a1a;
    --muted:#6b6b6b;
    --hair:#e7e5e4;
    --mark:#ff6719;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:"Spectral",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--sans);
    font-size:16px;line-height:1.5;
    padding:0 0 96px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:620px;margin:0 auto;padding:0 20px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:10;background:var(--paper);
    border-bottom:1px solid var(--hair);
    padding:calc(env(safe-area-inset-top) + 14px) 0 12px;
  }
  .bar{display:flex;align-items:baseline;gap:10px}
  h1{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
  .count{font-size:13px;color:var(--muted)}
  .search{
    margin-top:12px;width:100%;padding:9px 12px;font:inherit;font-size:15px;
    border:1px solid var(--hair);border-radius:6px;background:var(--tint);color:var(--ink);
  }
  .search:focus{outline:2px solid var(--mark);outline-offset:-1px;background:var(--paper)}

  /* ---------- card ---------- */
  .card{
    padding:22px 0;border-bottom:1px solid var(--hair);
    display:block;color:inherit;text-decoration:none;
  }
  .pub{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .logo{
    width:20px;height:20px;border-radius:4px;object-fit:cover;flex:none;
    background:var(--tint);border:1px solid var(--hair);
  }
  .pub-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .when{font-size:13px;color:var(--muted);flex:none;margin-left:auto}

  blockquote{
    margin:0 0 14px;padding-left:16px;border-left:3px solid var(--mark);
    font-family:var(--serif);font-size:18px;line-height:1.6;
  }
  .note{
    margin:0 0 14px;padding-left:19px;font-size:14px;color:var(--muted);font-style:italic;
  }

  .foot{display:flex;align-items:center;gap:12px}
  .foot-txt{min-width:0;flex:1}
  .title{font-size:15px;font-weight:600;line-height:1.35;margin:0}
  .byline{font-size:13px;color:var(--muted);margin:2px 0 0}
  .thumb{width:56px;height:56px;border-radius:4px;object-fit:cover;flex:none;background:var(--tint)}

  .actions{display:flex;gap:16px;margin-top:12px;padding-left:19px}
  .actions button{
    background:none;border:0;padding:0;font:inherit;font-size:13px;
    color:var(--muted);cursor:pointer;
  }
  .actions button:hover{color:var(--mark)}

  /* ---------- empty ---------- */
  .empty{padding:64px 0;text-align:center}
  .empty p{font-family:var(--serif);font-size:18px;color:var(--muted);margin:0 0 8px}
  .empty small{font-size:14px;color:var(--muted)}

  /* ---------- capture sheet ---------- */
  .sheet{
    position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);
    display:none;align-items:flex-end;
  }
  .sheet.open{display:flex}
  .sheet-inner{
    background:var(--paper);width:100%;max-height:88vh;overflow:auto;
    border-radius:14px 14px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .sheet h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:0 0 14px}
  .sheet label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
  .sheet textarea,.sheet input{
    width:100%;padding:10px 12px;font:inherit;font-size:15px;
    border:1px solid var(--hair);border-radius:6px;background:var(--tint);color:var(--ink);
  }
  .sheet textarea{font-family:var(--serif);line-height:1.55;resize:vertical}
  .sheet-btns{display:flex;gap:10px;margin-top:20px}
  .btn{
    flex:1;padding:12px;font:inherit;font-size:15px;font-weight:600;
    border-radius:6px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);cursor:pointer;
  }
  .btn.primary{background:var(--mark);border-color:var(--mark);color:#fff}

  .fab{
    position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:15;
    width:52px;height:52px;border-radius:26px;border:0;background:var(--mark);color:#fff;
    font-size:26px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{--paper:#111110;--tint:#1c1b1a;--ink:#f0efed;--muted:#9a9793;--hair:#2e2c2a}
    .btn.primary{color:#fff}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="bar">
      <h1>Snips</h1>
      <span class="count" id="count"></span>
    </div>
    <input class="search" id="search" type="search" placeholder="Search your snips" autocomplete="off">
  </div>
</header>

<main class="wrap" id="list"></main>

<button class="fab" id="fab" aria-label="Add a snip">+</button>

<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <h2 id="sheet-title">Save a snip</h2>
    <label for="f-text">Passage</label>
    <textarea id="f-text" rows="5" placeholder="Paste the selected text"></textarea>
    <label for="f-url">Article link</label>
    <input id="f-url" type="url" placeholder="https://example.substack.com/p/...">
    <label for="f-note">Your note <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
    <input id="f-note" type="text" placeholder="Why this mattered">
    <div class="sheet-btns">
      <button class="btn" id="cancel">Cancel</button>
      <button class="btn primary" id="save">Save snip</button>
    </div>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   CONFIG — point this at your deployed metadata worker.
   Leave empty and the app still works, just without covers/authors.
------------------------------------------------------------------- */
const META_ENDPOINT = ""; // e.g. "https://snips-meta.you.workers.dev"

/* ------------------------------------------------------------------
   Storage: localStorage, with an in-memory fallback so the app never
   hard-fails in a sandboxed preview or private-browsing context.
------------------------------------------------------------------- */
const store = (() => {
  const KEY = "snips.v1";
  let mem = null;
  const usable = (() => {
    try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
    catch { return false; }
  })();
  return {
    all() {
      if (!usable) return mem ?? (mem = []);
      try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; }
    },
    write(arr) {
      if (!usable) { mem = arr; return; }
      try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch {}
    }
  };
})();

/* ------------------------------------------------------------------
   URL hygiene + text-fragment deep link.
   A text fragment lands the reader on the exact sentence, not the top
   of the post. Long passages use the start,end form to stay robust.
------------------------------------------------------------------- */
const JUNK = ["utm_source","utm_medium","utm_campaign","utm_content","r","showWelcome","triedRedirect","publication_id","post_id"];

function cleanUrl(raw) {
  try {
    const u = new URL(raw.trim());
    JUNK.forEach(p => u.searchParams.delete(p));
    u.hash = "";
    return u.toString().replace(/\?$/, "");
  } catch { return (raw || "").trim(); }
}

// Text fragments treat - , & as delimiters, so they need encoding.
const frag = s => encodeURIComponent(s).replace(/-/g,"%2D").replace(/,/g,"%2C").replace(/&/g,"%26");

function deepLink(snip) {
  if (!snip.url) return "#";
  const words = snip.text.trim().split(/\s+/);
  if (words.length <= 12) return snip.url + "#:~:text=" + frag(snip.text.trim());
  const start = words.slice(0, 6).join(" ");
  const end   = words.slice(-6).join(" ");
  return snip.url + "#:~:text=" + frag(start) + "," + frag(end);
}

/* ------------------------------------------------------------------
   Metadata enrichment. Non-blocking: the snip saves immediately and
   fills in publication, title, author and cover when the worker answers.
------------------------------------------------------------------- */
function fallbackPub(url) {
  try {
    const h = new URL(url).hostname.replace(/^www\./,"");
    const sub = h.endsWith(".substack.com") ? h.replace(".substack.com","") : h.split(".")[0];
    return sub.replace(/[-_]/g," ").replace(/\b\w/g, c => c.toUpperCase());
  } catch { return "Unknown publication"; }
}

async function enrich(snip) {
  if (!META_ENDPOINT || !snip.url) return;
  try {
    const r = await fetch(META_ENDPOINT + "?url=" + encodeURIComponent(snip.url));
    if (!r.ok) return;
    const m = await r.json();
    const list = store.all();
    const i = list.findIndex(s => s.id === snip.id);
    if (i < 0) return;
    Object.assign(list[i], {
      publication: m.publication || list[i].publication,
      title: m.title || list[i].title,
      author: m.author || list[i].author,
      cover: m.cover || list[i].cover,
      logo: m.logo || list[i].logo,
      enriched: true
    });
    store.write(list);
    render();
  } catch {}
}

/* ------------------------------------------------------------------
   Rendering
------------------------------------------------------------------- */
const esc = s => (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function ago(ts) {
  const d = Math.floor((Date.now() - ts) / 86400000);
  if (d < 1) return "Today";
  if (d === 1) return "Yesterday";
  if (d < 7) return d + "d ago";
  if (d < 35) return Math.floor(d/7) + "w ago";
  return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

let filter = "";

function render() {
  const all = store.all().sort((a,b) => b.saved - a.saved);
  const q = filter.toLowerCase();
  const rows = q
    ? all.filter(s => (s.text+" "+s.title+" "+s.publication+" "+(s.note||"")).toLowerCase().includes(q))
    : all;

  document.getElementById("count").textContent =
    all.length ? all.length + (all.length === 1 ? " snip" : " snips") : "";

  const list = document.getElementById("list");

  if (!rows.length) {
    list.innerHTML = all.length
      ? `<div class="empty"><p>Nothing matches “${esc(filter)}”</p></div>`
      : `<div class="empty"><p>Your first snip goes here.</p>
         <small>Share a passage from an article, or tap + to paste one.</small></div>`;
    return;
  }

  list.innerHTML = rows.map(s => `
    <article class="card" data-id="${s.id}">
      <div class="pub">
        ${s.logo ? `<img class="logo" src="${esc(s.logo)}" alt="">` : `<span class="logo"></span>`}
        <span class="pub-name">${esc(s.publication || fallbackPub(s.url))}</span>
        <span class="when">${ago(s.saved)}</span>
      </div>
      <blockquote>${esc(s.text)}</blockquote>
      ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
      <div class="foot">
        <div class="foot-txt">
          <p class="title">${esc(s.title || "Untitled post")}</p>
          ${s.author ? `<p class="byline">${esc(s.author)}</p>` : ""}
        </div>
        ${s.cover ? `<img class="thumb" src="${esc(s.cover)}" alt="">` : ""}
      </div>
      <div class="actions">
        <button data-act="open">Read in context</button>
        <button data-act="copy">Copy</button>
        <button data-act="delete">Delete</button>
      </div>
    </article>`).join("");
}

/* ------------------------------------------------------------------
   Actions
------------------------------------------------------------------- */
document.getElementById("list").addEventListener("click", e => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.closest(".card").dataset.id;
  const snip = store.all().find(s => s.id === id);
  if (!snip) return;

  if (btn.dataset.act === "open") {
    window.open(deepLink(snip), "_blank", "noopener");
  }
  if (btn.dataset.act === "copy") {
    const payload = `“${snip.text}”\n— ${snip.author || snip.publication}, ${snip.url}`;
    navigator.clipboard?.writeText(payload);
    btn.textContent = "Copied";
    setTimeout(() => btn.textContent = "Copy", 1400);
  }
  if (btn.dataset.act === "delete") {
    store.write(store.all().filter(s => s.id !== id));
    render();
  }
});

document.getElementById("search").addEventListener("input", e => {
  filter = e.target.value; render();
});

/* ------------------------------------------------------------------
   Capture sheet
------------------------------------------------------------------- */
const sheet = document.getElementById("sheet");
const openSheet = (text="", url="") => {
  document.getElementById("f-text").value = text;
  document.getElementById("f-url").value = url;
  document.getElementById("f-note").value = "";
  sheet.classList.add("open");
  document.getElementById("f-text").focus();
};
const closeSheet = () => sheet.classList.remove("open");

document.getElementById("fab").onclick = () => openSheet();
document.getElementById("cancel").onclick = closeSheet;
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });

document.getElementById("save").onclick = () => {
  const text = document.getElementById("f-text").value.trim();
  if (!text) { document.getElementById("f-text").focus(); return; }
  const url = cleanUrl(document.getElementById("f-url").value);
  const snip = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    text,
    url,
    note: document.getElementById("f-note").value.trim(),
    publication: fallbackPub(url),
    title: "", author: "", cover: "", logo: "",
    saved: Date.now()
  };
  store.write([snip, ...store.all()]);
  closeSheet();
  render();
  enrich(snip);
};

/* ------------------------------------------------------------------
   Share-target intake.
   Android PWA share_target (GET) and the iOS Shortcut both arrive here
   as ?text=&url=&title=. Substack often bundles the URL inside `text`,
   so pull it out if the url param is missing.
------------------------------------------------------------------- */
(function intake() {
  const p = new URLSearchParams(location.search);
  let text = p.get("text") || "";
  let url  = p.get("url") || "";
  if (!text && !url) return;

  if (!url) {
    const found = text.match(/https?:\/\/\S+/);
    if (found) { url = found[0]; text = text.replace(found[0], "").trim(); }
  }
  text = text.replace(/^["“]|["”]$/g,"").trim();

  history.replaceState({}, "", location.pathname);
  openSheet(text, cleanUrl(url));
})();

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
